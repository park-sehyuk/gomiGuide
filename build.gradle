plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-security'
//	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 1. Querydsl 라이브러리
	implementation("org.mapstruct:mapstruct:1.5.5.Final")
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'

	annotationProcessor 'org.projectlombok:lombok'
	// 2. Q-Class 생성을 위한 APT 설정 (컴파일 시점에 실행)
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	// 롬복이랑 같이 설정되어 있으면 로딩되는 순서가 중요함 (롬복보다 뒤에 있어야함)
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	// 맵스트럭쳐가 실제 구현 코드를 생성
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def npmCommand = System.getProperty("os.name").toLowerCase().contains("windows")
		? "npm.cmd"
		: "/usr/local/bin/npm"

tasks.register("npmInstall", Exec) {
	workingDir "$projectDir/fronted"
	commandLine npmCommand, "install"
}

tasks.register("npmBuild", Exec) {
	workingDir "$projectDir/fronted"
	commandLine npmCommand, "run", "build"
	dependsOn "npmInstall"
}

tasks.named("processResources", Copy) {
	dependsOn "npmBuild"
	from("$projectDir/fronted/dist") {
		into "static"
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
